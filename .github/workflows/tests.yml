# Dépôt d'essai Cloudflare : la CI lance seulement les tests (le site est publié sur Cloudflare Pages, pas sur GitHub Pages).
name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
