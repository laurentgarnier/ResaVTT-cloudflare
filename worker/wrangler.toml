# Worker de l'essai Cloudflare (API de l'appli des sorties).
# Les identifiants de la base D1 et de l'espace KV sont remplis à la création (docs/ESSAI-CLOUDFLARE.md).
# Pas de [triggers] : le compte n'a plus de Cron Trigger libre ; le tic est appelé par la passerelle Apps Script.
# Secret à poser une fois : npx wrangler secret put SECRET_PASSERELLE -c worker/wrangler.toml
name = "resavtt-essai"
main = "index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "resavtt-essai"
database_id = "1f0892ca-8341-4c99-8468-98069aad2193"

[[kv_namespaces]]
binding = "TRACES"
id = "cf89fa25623b4fdb975ae5c733a3b2f7"

[vars]
URL_PASSERELLE = ""

# Une seule instance traite les requêtes POST une par une (comme le verrou du script sur Google).
[[durable_objects.bindings]]
name = "VERROU"
class_name = "VerrouSorties"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VerrouSorties"]
